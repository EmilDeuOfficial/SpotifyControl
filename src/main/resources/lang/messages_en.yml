# SpotifyControl language file (English)
# Color codes use '&' and are converted to the Minecraft formatting character at load time.
# Placeholders in {curly braces} are replaced by the mod and must be kept.

prefix: "&a[SpotifyControl]&r "

mod.enabled: "&aSpotifyControl is now enabled."
mod.disabled: "&cSpotifyControl is now disabled."
mod.status: "&7State: {state}&7, parties: &f{parties}&7, listeners: &f{listeners}&7, voice chat: &f{voicechat}"
mod.reloaded: "&aConfiguration reloaded."
mod.state_on: "&aenabled"
mod.state_off: "&cdisabled"
mod.disabled_notice: "&cSpotifyControl is disabled on this server."

party.created: "&aListening party started in &f{mode}&a mode."
party.joined: "&aYou joined the listening party of &f{host}&a."
party.left: "&7You left the listening party."
party.ended: "&7The listening party of &f{host}&7 has ended."
party.member_joined: "&f{player}&7 joined the listening party."
party.member_left: "&f{player}&7 left the listening party."
party.not_in: "&cYou are not in a listening party."
party.already_in: "&cYou are already in a listening party."
party.unknown_host: "&cThat player is not hosting a listening party."
party.host_only: "&cOnly the host can do that."
party.broadcast_disabled: "&cAudio broadcasting is disabled on this server."
party.now_playing: "&7Now playing: &f{track}&7 by &f{artist}"
party.invited: "&aInvited &f{player}&a to your listening party."
party.invite_received: "&f{host}&7 invited you. Use &f/spotifycontrol party join {host}"
