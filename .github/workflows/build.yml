name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  universal-jar:
    name: Universal jar
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The generation list comes from the build itself rather than being repeated here, so adding a
      # Minecraft version stays a one line change in versions.properties and build.gradle.kts.
      - name: Compile every API generation
        run: |
          set -euo pipefail
          targets=$(./gradlew -q printGenerationTargets | grep -E '^1\.')
          echo "generations: $(echo $targets | tr '\n' ' ')"
          for mc in $targets; do
            echo "::group::Minecraft $mc"
            ./gradlew build stageGenerationJar -Pmc="$mc" --console=plain --stacktrace
            echo "::endgroup::"
          done

      - name: Merge the universal jar
        run: ./gradlew universalJar --console=plain --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyControl
          path: versions/*.jar
          if-no-files-found: error
